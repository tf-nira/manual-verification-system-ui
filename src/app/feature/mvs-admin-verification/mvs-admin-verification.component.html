<div class="admin-verification-container">
  <app-header></app-header>

  <div class="verification-content">
    <div class="verification-form">
      <h2>Check Registration Status</h2>
      
      <div class="search-section">
        <div class="form-group">
          <label for="regId">Registration ID:</label>
          <input
            type="text"
            id="regId"
            [(ngModel)]="regId"
            placeholder="Enter Registration ID"
            class="search-input"
            (keyup.enter)="checkStatus()"
            [disabled]="isLoading"
          />
        </div>

        <div class="button-group">
          <button
            class="btn-check"
            (click)="checkStatus()"
            [disabled]="isLoading || !regId.trim()"
          >
            {{ isLoading ? 'Checking...' : 'Check Status' }}
          </button>
          <button
            class="btn-clear"
            (click)="clearSearch()"
            [disabled]="isLoading"
          >
            Clear
          </button>
        </div>
      </div>

      <div *ngIf="error" class="error-message">
        <p>{{ error }}</p>
      </div>

      <div *ngIf="verificationResult" class="result-section">
        <h3>Status Details</h3>
        <div class="result-content">
          <div *ngIf="verificationResult | keyvalue as items" class="result-items">
            <div class="result-item" *ngFor="let item of items">
              <span class="label">{{ formatKey(item.key) }}:</span>
              <span class="value">{{ item.value }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
